# Local PostgreSQL for development and tests.
#   docker compose up -d
# Creates two databases: `inquirydesk` (app) and `inquirydesk_test` (API tests).
services:
  db:
    image: postgres:16-alpine
    container_name: inquirydesk-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inquirydesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inquirydesk"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
